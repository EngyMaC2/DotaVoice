name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить системные библиотеки для Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent]"
      - name: Линтер
        run: python -m pyflakes dota_voice install.py scripts tests
      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
