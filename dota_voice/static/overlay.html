<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Voice Bridge · Оверлей</title>
<style>
  :root {
    --radiant: #7ed957;
    --radiant-dim: #2f6b23;
    --dire: #ff5d5d;
    --dire-dim: #7a2222;
    --panel: rgba(12, 14, 20, 0.62);
    --text: #f2f4f8;
    --muted: #9aa4b2;
    --speak: #ffd166;
  }
  /* Fully transparent so it can sit over the game / OBS Browser Source. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    overflow: hidden;
    /* Never intercept clicks meant for the game. */
    pointer-events: none;
    user-select: none;
  }
  #root {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 360px;
  }
  /* `hidden` must win over the flex rules below, or a hidden flag/wave still
     shows. Every element we toggle with `.hidden = true` relies on this. */
  [hidden] { display: none !important; }
  /* Interactive controls. Everything outside these passes clicks to the game. */
  [data-interactive] {
    pointer-events: auto;
    cursor: pointer;
  }
  .handle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: 14px;
    cursor: grab;
    user-select: none;
  }
  .handle:active { cursor: grabbing; }
  .mic {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--panel);
    font-size: 12px;
    white-space: nowrap;
  }
  .mic__dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .mic__dot.live { box-shadow: 0 0 8px currentColor; }
  .mic.muted { color: #ff8a8a; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast {
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--speak);
    animation: fade 0.25s ease;
  }
  .match {
    background: var(--panel);
    border-radius: 14px;
    padding: 12px 14px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    animation: fade 0.25s ease;
  }
  .match__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .match__id { font-weight: 700; font-size: 14px; letter-spacing: 0.3px; }
  .match__phase { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .badge-reconnect {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(255, 209, 102, 0.2);
    color: var(--speak);
    margin-left: 6px;
  }
  .team { margin-top: 8px; }
  .team__title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .team--radiant .team__title { color: var(--radiant); }
  .team--dire .team__title { color: var(--dire); }
  .player {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    margin-top: 4px;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.04);
    border-left: 3px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .team--radiant .player { border-left-color: var(--radiant-dim); }
  .team--dire .player { border-left-color: var(--dire-dim); }
  .player.speaking {
    background: rgba(255, 209, 102, 0.16);
    border-left-color: var(--speak);
  }
  .player.muted { opacity: 0.55; }
  /* Not on the voice network: visible, but greyed out so it is obvious at a
     glance who still has to start DotaVoice. */
  .player.offline { opacity: 0.4; filter: grayscale(1); }
  .player.offline .player__name { color: var(--muted); }
  .team--unknown .team__title { color: var(--muted); }
  .team--unknown .player { border-left-color: #3a3f4b; }
  .player__heroicon {
    width: 26px; height: 15px; border-radius: 3px; object-fit: cover;
    flex: none; background: rgba(255, 255, 255, 0.08);
  }
  /* No pick yet: the same footprint as the portrait, so rows do not jump when
     a hero is chosen. */
  .player__heroicon--none {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--muted); letter-spacing: -0.5px;
  }
  .player__body { flex: 1; min-width: 0; }
  .player__name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player__sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player__team { font-size: 10px; color: var(--muted); flex: none; }
  .icons { display: flex; gap: 4px; font-size: 12px; }
  .wave { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  .wave span {
    width: 3px; background: var(--speak); border-radius: 2px;
    animation: bounce 0.7s infinite ease-in-out;
  }
  .wave span:nth-child(2) { animation-delay: 0.15s; }
  .wave span:nth-child(3) { animation-delay: 0.3s; }
  .empty { color: var(--muted); font-size: 12px; padding: 8px; }
  /* First-appearance only: the fade must NOT replay on every state tick, or the
     whole overlay flickers. The renderer adds these classes once and never
     rebuilds the nodes, so the animation plays exactly one time. */
  .enter { animation: fade 0.25s ease; }
  /* ---- chat panel (ТЗ: read and write without leaving the game) ----
     Translucent so it never blocks the view, and only the pieces a player can
     actually use are marked interactive (tabs, input, send). */
  .chat {
    margin-top: 10px;
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 10px;
    backdrop-filter: blur(6px);
  }
  .chat__tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  .chat__tab {
    font-size: 11px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .chat__tab.on { background: rgba(255, 255, 255, 0.16); color: var(--text); }
  /* A dot marks a channel with unread messages while another tab is open. */
  .chat__tab.has-unread::after {
    content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 5px;
    border-radius: 50%; background: var(--speak); vertical-align: middle;
  }
  .chat__log {
    max-height: 150px; overflow-y: auto; font-size: 12px; line-height: 1.45;
    display: flex; flex-direction: column; gap: 3px;
  }
  .chat__msg .chat__author { color: var(--muted); }
  .chat__msg.shared .chat__author { color: var(--speak); }
  .chat__row { display: flex; gap: 6px; margin-top: 6px; }
  .chat__input {
    flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 4px 8px;
    border-radius: 7px; border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(0, 0, 0, 0.28); color: var(--text);
  }
  .chat__send {
    font-size: 12px; padding: 4px 10px; border-radius: 7px; border: 0;
    background: var(--radiant-dim); color: var(--text); cursor: pointer;
  }
  .chat__hint { font-size: 10px; color: var(--muted); margin-top: 5px; }
  @keyframes bounce { 0%, 100% { height: 4px; } 50% { height: 12px; } }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
</style>
</head>
<body>
<div id="root">
  <div class="topbar">
    <div class="handle" id="handle" data-interactive data-action="drag" title="Перетащите оверлей (или зажмите Ctrl и потяните в любом месте)">⠿</div>
    <div class="mic" id="mic" data-interactive data-action="mic" title="Клик — сменить режим микрофона">
      <span class="mic__dot" id="mic-dot"></span>
      <span id="mic-label">Открытый микрофон</span>
    </div>
    <div class="mic" id="mic-mute" data-interactive data-action="mute" title="Заглушить / включить микрофон">
      <span id="mic-mute-label">Заглушить</span>
    </div>
  </div>
  <div id="toast"></div>
  <div id="matches"><div class="empty">Ожидание активной катки…</div></div>
</div>
<script>
(function () {
  const matches = document.getElementById("matches");
  const toast = document.getElementById("toast");
  const state = new Map(); // match_id -> state
  let mic = { mode: "continuous", mode_label: "Открытый микрофон",
              mode_color: "#7ed957", active: true };

  // The native bridge is installed by the window's injected bootstrap. That
  // bootstrap first publishes a no-op object and only later upgrades it to the
  // live one (the Qt WebChannel handshake is asynchronous), so we must read
  // `window.overlayBridge` on every use - capturing it once would freeze us on
  // the no-op object and silently disable every control.
  const overlayBridge = () => window.overlayBridge || {
    available: false,
    setInteractiveRects: function () {}, cycleMic: function () {},
    toggleMute: function () {}, setChatFocus: function () {},
  };

  // ---- report our interactive controls to the native window ----------------
  // The window is click-through, so it never receives a mousemove and cannot
  // use :hover. Instead we hand it the rectangles of our controls (in page
  // pixels) together with the action a click should perform; the window reads
  // the real cursor itself and performs the drag or the click natively.
  // `action: "drag"` marks the handle, which moves the whole overlay.
  function reportInteractiveRects() {
    const rects = [];
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      const r = el.getBoundingClientRect();
      // A hidden control has no box: skip it so the window does not treat an
      // empty rectangle as clickable.
      if (r.width < 1 || r.height < 1) return;
      rects.push({
        x: r.left, y: r.top, w: r.width, h: r.height,
        action: el.dataset.action || (el.dataset.drag === "true" ? "drag" : "click"),
      });
    });
    const b = overlayBridge();
    if (b && b.setInteractiveRects) b.setInteractiveRects(rects);
  }
  window.reportInteractiveRects = reportInteractiveRects;
  window.addEventListener("resize", reportInteractiveRects);

  // Tell the native window how big our content actually is, so it can grow to
  // fit the whole roster instead of clipping it at a fixed size. In a browser /
  // OBS the window is whatever the source is, so this is a no-op there.
  function reportContentSize() {
    const root = document.getElementById("root");
    if (!root) return;
    const rect = root.getBoundingClientRect();
    const b = overlayBridge();
    if (b && b.setContentSize) {
      // 16px of margin on each side, matching #root's offset.
      b.setContentSize(Math.ceil(rect.right + 16), Math.ceil(rect.bottom + 16));
    }
  }
  window.reportContentSize = reportContentSize;

  // ---- microphone indicator: click cycles the mode ------------------------
  const micDot = document.getElementById("mic-dot");
  const micLabel = document.getElementById("mic-label");
  document.getElementById("mic").addEventListener("click", (ev) => {
    ev.stopPropagation();
    // When the native bridge is present the window performs the click itself;
    // we only handle it here for the browser/OBS path.
    if (!overlayBridge().available) overlayBridge().cycleMic();
  });

  // ---- self-mute: one click silences (or restores) the microphone ---------
  const micMute = document.getElementById("mic-mute");
  const micMuteLabel = document.getElementById("mic-mute-label");
  micMute.addEventListener("click", async (ev) => {
    ev.stopPropagation();
    // The native window owns the click when its bridge is present.
    if (overlayBridge().available) return;
    await toggleSelfMute();
  });

  async function toggleSelfMute() {
    try {
      const res = await fetch("/api/voice/mic/mute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ toggle: true }),
      });
      mic = Object.assign({}, mic, await res.json());
      renderMic();
    } catch (e) { /* the websocket will catch up */ }
  }
  window.toggleSelfMute = toggleSelfMute;

  function renderMic() {
    micDot.style.background = mic.active ? mic.mode_color : "#555";
    micDot.style.color = mic.mode_color;
    micDot.classList.toggle("live", !!mic.active);
    micLabel.textContent = mic.mode_label || mic.mode;
    if (mic.self_muted) {
      micMuteLabel.textContent = "Включить";
      micMute.classList.add("muted");
    } else {
      micMuteLabel.textContent = "Заглушить";
      micMute.classList.remove("muted");
    }
    reportInteractiveRects();
  }

  function showToast(text) {
    if (!text) return;
    toast.textContent = text;
    toast.className = "toast";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => {
      toast.textContent = "";
      toast.className = "";
    }, 6000);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function phaseLabel(phase) {
    return {
      "none": "нет матча",
      "hero_selection": "выбор героев",
      "strategy_time": "подготовка к игре",
      "pre_game": "подготовка",
      "playing": "идёт игра",
      "ended": "матч завершён",
    }[phase] || phase;
  }

  // A stable key for a player within a match: the account id when we have it,
  // otherwise the name (a bare slot with no name would collide across teams).
  function playerKey(p) {
    return p.player_id || p.name || "?";
  }

  function playerLabel(p) {
    return p.display_name || p.name || p.player_id || "Игрок";
  }

  // The animated speaking bars must be created once and then only shown/hidden,
  // otherwise every state tick restarts the animation (a flicker).
  function ensurePlayerRow(container, p) {
    const key = playerKey(p);
    let row = container.querySelector(`[data-key="${cssEscape(key)}"]`);
    if (row) return row;
    row = document.createElement("div");
    row.className = "player enter";
    row.dataset.key = key;
    row.innerHTML =
      '<img class="player__heroicon" alt="" hidden />' +
      '<span class="player__heroicon player__heroicon--none" hidden>—</span>' +
      '<span class="player__body">' +
        '<span class="player__name"></span>' +
        '<span class="player__sub"></span>' +
      "</span>" +
      '<span class="icons">' +
        '<span class="wave" hidden><span></span><span></span><span></span></span>' +
        '<span class="flag" data-flag="local" hidden>🎙</span>' +
        '<span class="flag" data-flag="offline" hidden>📴</span>' +
        '<span class="flag" data-flag="muted" hidden>🔇</span>' +
        '<span class="flag" data-flag="deafened" hidden>🎧</span>' +
      "</span>";
    container.appendChild(row);
    // Drop the one-shot fade so a later re-render does not replay it.
    row.addEventListener("animationend", () => row.classList.remove("enter"), { once: true });
    return row;
  }

  function updatePlayerRow(row, p) {
    row.classList.toggle("speaking", !!p.speaking && !p.muted);
    row.classList.toggle("muted", !!p.muted);
    row.classList.toggle("offline", !p.connected);
    const name = row.querySelector(".player__name");
    const label = playerLabel(p);
    if (name.textContent !== label) name.textContent = label;
    // Hero: a portrait plus the hero's name in parentheses, or "Выбор…" before a
    // pick. The team name sits beside it so a row reads the same wherever it is
    // shown, even if the grouping is not obvious.
    const heroName = p.hero_label || p.hero || "Выбор…";
    const teamName = p.team_label || "";
    const subText = `(${heroName})${teamName ? " · " + teamName : ""}`;
    const sub = row.querySelector(".player__sub");
    if (sub.textContent !== subText) sub.textContent = subText;
    const img = row.querySelector("img.player__heroicon");
    const none = row.querySelector("span.player__heroicon--none");
    if (p.hero_icon) {
      if (img.getAttribute("src") !== p.hero_icon) img.setAttribute("src", p.hero_icon);
      img.hidden = false;
      none.hidden = true;
    } else {
      img.hidden = true;
      none.hidden = false;
    }
    const setFlag = (flag, on) => {
      const el = row.querySelector(`[data-flag="${flag}"]`);
      if (el) el.hidden = !on;
    };
    setFlag("local", !!p.is_local);
    setFlag("offline", !p.connected);
    setFlag("muted", !!p.muted);
    setFlag("deafened", !!p.deafened);
    const wave = row.querySelector(".wave");
    wave.hidden = !(p.speaking && !p.muted);
  }

  // Reconcile one team block: keep the node, only add/remove/reorder rows.
  function renderTeam(container, players) {
    const seen = new Set();
    players.forEach((p) => {
      const key = playerKey(p);
      seen.add(key);
      const row = ensurePlayerRow(container, p);
      updatePlayerRow(row, p);
      container.appendChild(row); // moves an existing row to the end (reorder)
    });
    container.querySelectorAll(".player").forEach((row) => {
      if (!seen.has(row.dataset.key)) row.remove();
    });
  }

  // The whole overlay DOM is built once per match and then updated in place.
  // Replacing innerHTML on every GSI tick (up to ~10/s) restarted every CSS
  // animation and made the overlay blink; this keeps the nodes stable.
  const matchNodes = new Map(); // match_id -> {root, head, phase, teams, unknown, invite}

  function ensureMatch(match_id) {
    let node = matchNodes.get(match_id);
    if (node) return node;
    const root = document.createElement("div");
    root.className = "match enter";
    root.dataset.match = match_id;
    root.innerHTML =
      '<div class="match__head">' +
        '<span class="match__id"></span>' +
        '<span class="match__phase"></span>' +
      "</div>" +
      '<div class="invite toast" hidden></div>' +
      '<div class="team team--radiant">' +
        '<div class="team__title"><span>Силы Света</span><span class="count">0</span></div>' +
      "</div>" +
      '<div class="team team--dire">' +
        '<div class="team__title"><span>Силы Тьмы</span><span class="count">0</span></div>' +
      "</div>" +
      '<div class="team team--unknown">' +
        '<div class="team__title"><span>Не подключены к DotaVoice</span><span class="count">0</span></div>' +
      "</div>" +
      // Chat lives in the overlay so a player can read and answer without
      // leaving the game. The log is rebuilt on each render (cheap: only the
      // last few messages), but the input keeps its text because we only touch
      // the log node.
      '<div class="chat" hidden>' +
        '<div class="chat__tabs"></div>' +
        '<div class="chat__log"></div>' +
        '<div class="chat__row">' +
          // While the overlay is click-through the native window performs the
          // click itself, so the input carries an action that opens it; once it
          // is open the window is interactive and real clicks land here.
          '<input class="chat__input" data-interactive data-action="chat-input" maxlength="500" placeholder="Сообщение команде…" />' +
          '<button class="chat__send" data-interactive data-action="chat-send">Отправить</button>' +
        "</div>" +
        '<div class="chat__hint">Enter — ввод, Esc — закрыть. Настраивается в главном окне.</div>' +
      "</div>";
    root.addEventListener("animationend", () => root.classList.remove("enter"), { once: true });
    matches.appendChild(root);
    node = {
      root,
      id: root.querySelector(".match__id"),
      phase: root.querySelector(".match__phase"),
      invite: root.querySelector(".invite"),
      radiant: root.querySelector(".team--radiant"),
      dire: root.querySelector(".team--dire"),
      unknown: root.querySelector(".team--unknown"),
      chat: root.querySelector(".chat"),
      chatTabs: root.querySelector(".chat__tabs"),
      chatLog: root.querySelector(".chat__log"),
      chatInput: root.querySelector(".chat__input"),
      chatSend: root.querySelector(".chat__send"),
    };
    // Tabs and send are page actions the native window forwards to us when it
    // performs the click itself; a real click only reaches the page while the
    // chat box holds focus (the window is click-through otherwise), so the two
    // paths never both fire.
    node.chatTabs.addEventListener("click", (ev) => {
      const tab = ev.target.closest("[data-channel]");
      if (!tab) return;
      ev.stopPropagation();
      selectChannel(match_id, tab.dataset.channel);
    });
    node.chatSend.addEventListener("click", (ev) => {
      ev.stopPropagation();
      sendChat(match_id);
    });
    node.chatInput.addEventListener("keydown", (ev) => {
      // Enter sends; Esc closes the box so the next key goes to the game again.
      if (ev.key === "Enter") { ev.preventDefault(); sendChat(match_id); }
      else if (ev.key === "Escape") { ev.preventDefault(); closeChatInput(); }
      ev.stopPropagation();
    });
    // While the box has focus it must keep receiving keys (the game must not
    // steal them); the native window sees this flag and stops polling keys.
    node.chatInput.addEventListener("focus", () => setChatFocus(true));
    // Clicking Send or a tab moves focus off the input for an instant. Closing
    // on that blur would hand the window back to the game mid-click (the mouseup
    // would fall through and the click would never land), so we wait a tick and
    // only release if focus left the whole panel.
    node.chatInput.addEventListener("blur", () => {
      setTimeout(() => {
        if (!node.chat.contains(document.activeElement)) setChatFocus(false);
      }, 0);
    });
    matchNodes.set(match_id, node);
    return node;
  }

  function renderMatch(match_id, m) {
    const node = ensureMatch(match_id);
    const reconnect = m.reconnects > 0
      ? `<span class="badge-reconnect">переподключение ×${m.reconnects}</span>` : "";
    const idHtml = `Матч ${escapeHtml(m.match_id || match_id)}${reconnect}`;
    if (node.id.innerHTML !== idHtml) node.id.innerHTML = idHtml;
    // During the post-match window the overlay shows how long the shared room
    // stays open, so players know how much time they have left to talk.
    let phase = phaseLabel(m.phase);
    if (!m.voice_active && m.post_game_remaining > 0) {
      const mins = Math.ceil(m.post_game_remaining / 60);
      phase += ` · ещё ${mins} мин`;
    }
    if (node.phase.textContent !== phase) node.phase.textContent = phase;
    if (m.invite_key) {
      node.invite.hidden = false;
      const text = `Приглашение: ${m.invite_key}`;
      if (node.invite.textContent !== text) node.invite.textContent = text;
    } else {
      node.invite.hidden = true;
    }
    // The counter reads "in DotaVoice / in the match" (e.g. 5/5 on a full team),
    // the same as the control panel, so the overlay shows how much of the game's
    // roster the app reaches - not merely how many rows are drawn.
    const setCount = (el, players) => {
      const connected = players.filter((p) => p.connected).length;
      el.querySelector(".count").textContent = `${connected}/${players.length}`;
    };
    renderTeam(node.radiant, m.radiant || []);
    renderTeam(node.dire, m.dire || []);
    renderTeam(node.unknown, m.unknown || []);
    setCount(node.radiant, m.radiant || []);
    setCount(node.dire, m.dire || []);
    setCount(node.unknown, m.unknown || []);
    node.unknown.hidden = !(m.unknown && m.unknown.length);
    renderChat(match_id, node, m);
    ensureChatSeeded(match_id, m);
    // Keep the panel height driven by content: the native window grows to fit.
    matches.style.height = "auto";
  }

  // ---- chat: tabs Свет / Тьма / Общий, last few messages, an input ---------
  // The server decides which channels are visible (its own room while the match
  // runs, the shared post-match room after). We only mirror that list.
  const chatView = new Map(); // match_id -> { active, unread: Set, seededKey }

  function chatStateFor(match_id) {
    let v = chatView.get(match_id);
    if (!v) {
      v = { active: null, unread: new Set(), seededKey: null };
      chatView.set(match_id, v);
    }
    return v;
  }

  // Seed the panel from the server once per channel set: the state ticks carry
  // the roster and the room list, but chat history is fetched (and then kept
  // current by chat_message events), so we do not resend the whole log ten
  // times a second. Re-seeding when the rooms change is what loads the
  // post-match discussion the moment it opens.
  async function ensureChatSeeded(match_id, m) {
    const view = chatStateFor(match_id);
    if (!m.chat_active) return;
    const key = (m.chat_channels || []).map((c) => c.value).sort().join(",");
    if (view.seededKey === key) return;
    view.seededKey = key;
    await refreshChat(match_id);
  }

  function renderChat(match_id, node, m) {
    const channels = m.chat_channels || [];
    const view = chatStateFor(match_id);
    node.chat.hidden = !channels.length;
    if (!channels.length) return;
    // Keep the active tab valid as channels open and close with the match.
    if (!channels.some((c) => c.value === view.active)) {
      view.active = channels[0].value;
      view.unread.clear();
    }
    const tabsHtml = channels.map((c) =>
      `<button class="chat__tab${c.value === view.active ? " on" : ""}` +
      `${view.unread.has(c.value) ? " has-unread" : ""}" data-interactive ` +
      `data-action="chat-tab:${escapeHtml(c.value)}" data-channel="${escapeHtml(c.value)}">` +
      `${escapeHtml(c.label)}</button>`
    ).join("");
    // Rewrite only on change: this runs on every GSI tick, and rebuilding the
    // tabs ten times a second would break hover and hit-testing.
    if (node.chatTabs.innerHTML !== tabsHtml) node.chatTabs.innerHTML = tabsHtml;
    const history = (m.chat_history && m.chat_history[view.active]) || [];
    const recent = history.slice(-8);
    const html = recent.length
      ? recent.map((msg) =>
          `<div class="chat__msg${msg.channel === "post_game" ? " shared" : ""}">` +
          `<span class="chat__author">${escapeHtml(msg.author_name || msg.author_id)}:</span> ` +
          `<span class="chat__text">${escapeHtml(msg.text)}</span></div>`
        ).join("")
      : '<div class="empty">Сообщений пока нет.</div>';
    // Only touch the DOM when the content actually changed: rebuilding on every
    // GSI tick would fight the user's scroll position.
    if (node.chatLog.innerHTML !== html) {
      node.chatLog.innerHTML = html;
      node.chatLog.scrollTop = node.chatLog.scrollHeight;
    }
    const input = node.chatInput;
    input.placeholder = view.active === "post_game"
      ? "Сообщение обеим командам…" : "Сообщение команде…";
    node.chatSend.dataset.channel = view.active;
  }

  // A message arrived over the socket: add it to the active channel's log, or
  // mark the tab unread and flash a nudge if it belongs to another channel.
  function appendChatMessage(match_id, payload) {
    const message = (payload && payload.message) || {};
    const channel = payload.channel || message.channel;
    const m = state.get(match_id);
    if (!m || !channel) return;
    const history = m.chat_history || (m.chat_history = {});
    (history[channel] || (history[channel] = [])).push(message);
    const view = chatStateFor(match_id);
    if (channel !== view.active) {
      view.unread.add(channel);
      const author = message.author_name || message.author_id || "игрок";
      showToast(`${author}: ${message.text}`);
    }
    render();
  }

  function selectChannel(match_id, channel) {
    const view = chatStateFor(match_id);
    view.active = channel;
    view.unread.delete(channel);
    const m = state.get(match_id);
    const node = matchNodes.get(match_id);
    if (m && node) {
      renderChat(match_id, node, m);
      // Rewriting the tabs drops focus; put the caret back in the box so the
      // player keeps typing (and so the window stays in chat mode).
      node.chatInput.focus();
    }
  }

  async function sendChat(match_id) {
    const node = matchNodes.get(match_id);
    const view = chatStateFor(match_id);
    if (!node || !view.active) return;
    const text = node.chatInput.value.trim();
    if (!text) return;
    node.chatInput.value = "";
    try {
      await fetch(`/api/sessions/${match_id}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, channel: view.active }),
      });
      await refreshChat(match_id);
    } catch (e) { showToast("Не удалось отправить сообщение"); }
    // Keep the box open and focused for the next message; Esc is the way back
    // to the game.
    node.chatInput.focus();
  }

  async function refreshChat(match_id) {
    try {
      const data = await (await fetch(`/api/sessions/${match_id}/chat`)).json();
      merge(match_id, { chat_channels: data.channels, chat_history: data.history });
      render();
    } catch (e) { /* the websocket will catch up */ }
  }

  // Chat input focus: while the box is focused the game must not take the keys
  // back, so we tell the native window to stop its key polling and stay
  // interactive. In a browser / OBS there is no bridge and this is a no-op.
  function setChatFocus(focused) {
    window.chatFocused = focused;
    const b = overlayBridge();
    if (b && b.setChatFocus) b.setChatFocus(focused);
  }

  function closeChatInput() {
    matchNodes.forEach((node) => node.chatInput.blur());
    setChatFocus(false);
  }
  window.closeChatInput = closeChatInput;

  // The native window performs clicks itself while the overlay is click-through
  // (it cannot run page code), so for our own controls it calls back here with
  // the action it found under the cursor. A plain browser/OBS page handles the
  // clicks with the listeners above instead.
  window.overlayPageAction = function (action) {
    const [name, arg] = String(action || "").split(":");
    const id = [...matchNodes.keys()][0];
    const node = id && matchNodes.get(id);
    if (name === "chat-input") { openChatInput(id); return; }
    if (name === "chat-send") { sendChat(id); return; }
    if (name === "chat-tab" && arg && node) {
      // Keep the box open if it already was: switching rooms mid-typing must
      // not bounce the player back to the game.
      const wasOpen = node.chat.contains(document.activeElement);
      selectChannel(id, arg);
      if (!wasOpen) closeChatInput();
    }
  };

  // The overlay hotkey (or a click) opens the chat box; the native window calls
  // this, and a plain page (OBS) can call it from its own key handler.
  window.openChatInput = function (match_id) {
    const id = match_id || [...matchNodes.keys()][0];
    const node = id && matchNodes.get(id);
    if (!node || node.chat.hidden) return;
    setChatFocus(true);
    node.chatInput.focus();
  };

  function render() {
    if (state.size === 0) {
      matchNodes.forEach((node) => node.root.remove());
      matchNodes.clear();
      if (!matches.querySelector(".empty")) {
        matches.innerHTML = '<div class="empty">Ожидание активной катки…</div>';
      }
      return;
    }
    const empty = matches.querySelector(".empty");
    if (empty) empty.remove();
    state.forEach((m, match_id) => renderMatch(match_id, m));
    matchNodes.forEach((node, match_id) => {
      if (!state.has(match_id)) {
        node.root.remove();
        matchNodes.delete(match_id);
      }
    });
    reportInteractiveRects();
    reportContentSize();
  }

  function merge(match_id, payload) {
    const existing = state.get(match_id) || {};
    state.set(match_id, Object.assign({}, existing, payload));
  }

  function cssEscape(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/["\\]/g, "\\$&");
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/overlay`);
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "mic_state") {
        mic = Object.assign({}, mic, msg.payload);
        renderMic();
        return;
      }
      if (!msg.match_id) return;
      if (msg.type === "session_ended" || msg.type === "session_closed") {
        state.delete(msg.match_id);
        chatView.delete(msg.match_id);
      } else if (msg.type === "invite_ready") {
        merge(msg.match_id, { invite_key: msg.payload.invite_key });
        showToast(msg.payload.message);
      } else if (msg.type === "chat_message") {
        appendChatMessage(msg.match_id, msg.payload);
        return;
      } else if (msg.type === "state" || msg.type === "roster_synced" ||
                 msg.type === "channels_ready") {
        merge(msg.match_id, msg.payload);
      } else if (msg.payload && (msg.payload.player_id || msg.payload.radiant)) {
        merge(msg.match_id, msg.payload);
      }
      render();
    };
    ws.onclose = () => setTimeout(connect, 1500);
    ws.onerror = () => ws.close();
  }

  // Pull the current microphone state once, so the indicator is right even
  // before the first event arrives.
  fetch("/api/voice/mic").then((r) => r.json()).then((data) => {
    mic = Object.assign({}, mic, data);
    renderMic();
  }).catch(() => {});

  renderMic();
  reportInteractiveRects();
  connect();
})();
</script>
</body>
</html>
