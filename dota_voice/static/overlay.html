<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Voice Bridge · Оверлей</title>
<style>
  :root {
    --radiant: #7ed957;
    --radiant-dim: #2f6b23;
    --dire: #ff5d5d;
    --dire-dim: #7a2222;
    --panel: rgba(12, 14, 20, 0.62);
    --text: #f2f4f8;
    --muted: #9aa4b2;
    --speak: #ffd166;
  }
  /* Fully transparent so it can sit over the game / OBS Browser Source. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    overflow: hidden;
    /* Never intercept clicks meant for the game. */
    pointer-events: none;
    user-select: none;
  }
  #root {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 360px;
  }
  /* Interactive controls. Everything outside these passes clicks to the game. */
  [data-interactive] {
    pointer-events: auto;
    cursor: pointer;
  }
  .handle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: 14px;
    cursor: grab;
    user-select: none;
  }
  .handle:active { cursor: grabbing; }
  .mic {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--panel);
    font-size: 12px;
    white-space: nowrap;
  }
  .mic__dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .mic__dot.live { box-shadow: 0 0 8px currentColor; }
  .mic.muted { color: #ff8a8a; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast {
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--speak);
    animation: fade 0.25s ease;
  }
  .match {
    background: var(--panel);
    border-radius: 14px;
    padding: 12px 14px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    animation: fade 0.25s ease;
  }
  .match__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .match__id { font-weight: 700; font-size: 14px; letter-spacing: 0.3px; }
  .match__phase { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .badge-reconnect {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(255, 209, 102, 0.2);
    color: var(--speak);
    margin-left: 6px;
  }
  .team { margin-top: 8px; }
  .team__title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .team--radiant .team__title { color: var(--radiant); }
  .team--dire .team__title { color: var(--dire); }
  .player {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    margin-top: 4px;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.04);
    border-left: 3px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .team--radiant .player { border-left-color: var(--radiant-dim); }
  .team--dire .player { border-left-color: var(--dire-dim); }
  .player.speaking {
    background: rgba(255, 209, 102, 0.16);
    border-left-color: var(--speak);
  }
  .player.muted { opacity: 0.55; }
  .player__name { font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player__hero { font-size: 11px; color: var(--muted); }
  .icons { display: flex; gap: 4px; font-size: 12px; }
  .wave { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  .wave span {
    width: 3px; background: var(--speak); border-radius: 2px;
    animation: bounce 0.7s infinite ease-in-out;
  }
  .wave span:nth-child(2) { animation-delay: 0.15s; }
  .wave span:nth-child(3) { animation-delay: 0.3s; }
  .empty { color: var(--muted); font-size: 12px; padding: 8px; }
  @keyframes bounce { 0%, 100% { height: 4px; } 50% { height: 12px; } }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
</style>
</head>
<body>
<div id="root">
  <div class="topbar">
    <div class="handle" id="handle" data-interactive data-drag="true" title="Перетащите оверлей">⠿</div>
    <div class="mic" id="mic" data-interactive title="Клик — сменить режим микрофона">
      <span class="mic__dot" id="mic-dot"></span>
      <span id="mic-label">Открытый микрофон</span>
    </div>
    <div class="mic" id="mic-mute" data-interactive title="Заглушить / включить микрофон">
      <span id="mic-mute-label">Заглушить</span>
    </div>
  </div>
  <div id="toast"></div>
  <div id="matches"><div class="empty">Ожидание активной катки…</div></div>
</div>
<script>
(function () {
  const matches = document.getElementById("matches");
  const toast = document.getElementById("toast");
  const state = new Map(); // match_id -> state
  let mic = { mode: "continuous", mode_label: "Открытый микрофон",
              mode_color: "#7ed957", active: true };

  const bridge = window.overlayBridge || {
    setInteractiveRects: function () {}, cycleMic: function () {},
  };

  // ---- report our interactive controls to the native window ----------------
  // The window is click-through, so it never receives a mousemove and cannot
  // use :hover. Instead we hand it the rectangles of our controls (in page
  // pixels); the window reads the real cursor itself and decides what to do.
  // `drag: true` marks the handle, which also moves the whole overlay.
  function reportInteractiveRects() {
    const rects = [];
    document.querySelectorAll("[data-interactive]").forEach((el) => {
      const r = el.getBoundingClientRect();
      rects.push({
        x: r.left, y: r.top, w: r.width, h: r.height,
        drag: el.dataset.drag === "true",
      });
    });
    if (bridge && bridge.setInteractiveRects) bridge.setInteractiveRects(rects);
  }
  window.reportInteractiveRects = reportInteractiveRects;
  window.addEventListener("resize", reportInteractiveRects);

  // ---- microphone indicator: click cycles the mode ------------------------
  const micDot = document.getElementById("mic-dot");
  const micLabel = document.getElementById("mic-label");
  document.getElementById("mic").addEventListener("click", (ev) => {
    ev.stopPropagation();
    bridge.cycleMic();
  });

  // ---- self-mute: one click silences (or restores) the microphone ---------
  const micMute = document.getElementById("mic-mute");
  const micMuteLabel = document.getElementById("mic-mute-label");
  micMute.addEventListener("click", async (ev) => {
    ev.stopPropagation();
    try {
      const res = await fetch("/api/voice/mic/mute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ toggle: true }),
      });
      mic = Object.assign({}, mic, await res.json());
      renderMic();
    } catch (e) { /* the websocket will catch up */ }
  });

  function renderMic() {
    micDot.style.background = mic.active ? mic.mode_color : "#555";
    micDot.style.color = mic.mode_color;
    micDot.classList.toggle("live", !!mic.active);
    micLabel.textContent = mic.mode_label || mic.mode;
    if (mic.self_muted) {
      micMuteLabel.textContent = "Включить";
      micMute.classList.add("muted");
    } else {
      micMuteLabel.textContent = "Заглушить";
      micMute.classList.remove("muted");
    }
    reportInteractiveRects();
  }

  function showToast(text) {
    if (!text) return;
    toast.textContent = text;
    toast.className = "toast";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => {
      toast.textContent = "";
      toast.className = "";
    }, 6000);
  }

  function teamBlock(team, players) {
    const cls = team === "radiant" ? "team--radiant" : "team--dire";
    const label = team === "radiant" ? "Силы Света" : "Силы Тьмы";
    const rows = players.map(playerRow).join("") || '<div class="empty">—</div>';
    return `<div class="team ${cls}">
      <div class="team__title"><span>${label}</span><span>${players.length}</span></div>
      ${rows}
    </div>`;
  }

  function playerRow(p) {
    const classes = ["player"];
    if (p.speaking) classes.push("speaking");
    if (p.muted) classes.push("muted");
    const icons = [];
    if (p.speaking && !p.muted) {
      icons.push('<span class="wave"><span></span><span></span><span></span></span>');
    }
    if (p.is_local) icons.push("🎙");
    if (p.muted) icons.push("🔇");
    if (p.deafened) icons.push("🎧");
    const hero = p.hero ? `<span class="player__hero">${p.hero}</span>` : "";
    return `<div class="${classes.join(" ")}">
      <span class="player__name">${escapeHtml(p.name || p.player_id)}</span>
      ${hero}
      <span class="icons">${icons.join("")}</span>
    </div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function phaseLabel(phase) {
    return {
      "none": "нет матча",
      "hero_selection": "выбор героев",
      "strategy_time": "подготовка к игре",
      "pre_game": "подготовка",
      "playing": "идёт игра",
      "ended": "матч завершён",
    }[phase] || phase;
  }

  function render() {
    if (state.size === 0) {
      matches.innerHTML = '<div class="empty">Ожидание активной катки…</div>';
      return;
    }
    matches.innerHTML = [...state.values()].map((m) => {
      const reconnect = m.reconnects > 0
        ? `<span class="badge-reconnect">переподключение ×${m.reconnects}</span>` : "";
      const invite = m.invite_key
        ? `<div class="toast">Приглашение: ${escapeHtml(m.invite_key)}</div>` : "";
      return `<div class="match">
        <div class="match__head">
          <span class="match__id">Матч ${escapeHtml(m.match_id)}${reconnect}</span>
          <span class="match__phase">${escapeHtml(phaseLabel(m.phase))}</span>
        </div>
        ${invite}
        ${teamBlock("radiant", m.radiant || [])}
        ${teamBlock("dire", m.dire || [])}
      </div>`;
    }).join("");
  }

  function merge(match_id, payload) {
    const existing = state.get(match_id) || {};
    state.set(match_id, Object.assign({}, existing, payload));
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/overlay`);
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "mic_state") {
        mic = Object.assign({}, mic, msg.payload);
        renderMic();
        return;
      }
      if (!msg.match_id) return;
      if (msg.type === "session_ended") {
        state.delete(msg.match_id);
      } else if (msg.type === "invite_ready") {
        merge(msg.match_id, { invite_key: msg.payload.invite_key });
        showToast(msg.payload.message);
      } else if (msg.type === "state" || msg.type === "roster_synced" ||
                 msg.type === "channels_ready") {
        merge(msg.match_id, msg.payload);
      } else if (msg.payload && (msg.payload.player_id || msg.payload.radiant)) {
        merge(msg.match_id, msg.payload);
      }
      render();
    };
    ws.onclose = () => setTimeout(connect, 1500);
    ws.onerror = () => ws.close();
  }

  // Pull the current microphone state once, so the indicator is right even
  // before the first event arrives.
  fetch("/api/voice/mic").then((r) => r.json()).then((data) => {
    mic = Object.assign({}, mic, data);
    renderMic();
  }).catch(() => {});

  renderMic();
  reportInteractiveRects();
  connect();
})();
</script>
</body>
</html>
