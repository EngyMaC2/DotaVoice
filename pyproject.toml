[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotavoice"
version = "0.1.0"
description = "Command Voice Bridge - team voice channels driven by game state (OpenHands agentic layer)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12.0",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
agent = ["openhands-sdk>=1.60", "openhands-tools>=1.60"]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["dota_voice*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
